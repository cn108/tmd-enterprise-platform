name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tmd
          POSTGRES_USER: tmd
          POSTGRES_PASSWORD: tmd_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tmd -d tmd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_DB: tmd
      POSTGRES_USER: tmd
      POSTGRES_PASSWORD: tmd_dev_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Django system checks
        run: python manage.py check

      - name: Django deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-placeholder-not-a-real-secret-0123456789
          DJANGO_ALLOWED_HOSTS: example.com
          EMAIL_HOST_USER: ci@example.com
          EMAIL_HOST_PASSWORD: ci-placeholder
          DEFAULT_FROM_EMAIL: CI <ci@example.com>
        # Production settings are fail-closed, so the smoke check needs throwaway
        # Fernet keys. They are generated here and never stored anywhere.
        run: |
          export BANK_ACCOUNT_ENCRYPTION_KEYS="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          export MFA_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          python manage.py check --deploy

      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest

  frontend:
    name: Frontend (lint, build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test -- --watch=false

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Scan tracked files
        run: python scripts/check_secrets.py
