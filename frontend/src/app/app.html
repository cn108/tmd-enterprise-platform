<header class="app-header">
  <div class="brand">
    <span class="brand__mark">TMD</span>
    <div class="brand__text">
      <h1>TMD Platform</h1>
      <p>Tico McDon Limited · procurement, inventory and financial management</p>
    </div>
  </div>

  @if (user(); as signedIn) {
    <div class="session">
      <div class="session__who">
        <span class="session__name">{{ signedIn.full_name }}</span>
        <span class="session__meta">
          {{ signedIn.email }}{{ signedIn.department ? ' · ' + signedIn.department : '' }}
        </span>
      </div>
      <button type="button" class="session__signout" (click)="signOut()">Sign out</button>
    </div>
  } @else {
    <span class="phase">Secure area</span>
  }
</header>

<main class="app-content">
  <router-outlet />
</main>

<footer class="app-footer">
  <p>Phase 2 · identity and authentication</p>
</footer>
