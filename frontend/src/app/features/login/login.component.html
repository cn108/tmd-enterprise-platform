<section class="login" aria-labelledby="login-heading">
  <div class="login__card">
    <header class="login__header">
      <span class="login__mark">TMD</span>
      <h1 id="login-heading">Sign in</h1>
      <p>Tico McDon Limited — internal system</p>
    </header>

    @if (errorMessage(); as message) {
      <p class="login__error" role="alert">{{ message }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span class="field__label">Email address</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="username"
          inputmode="email"
          [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
          [attr.aria-describedby]="form.controls.email.touched && form.controls.email.invalid ? 'email-error' : null"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="field__error" id="email-error">Enter a valid email address.</span>
        }
      </label>

      <label class="field">
        <span class="field__label">Password</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
          [attr.aria-describedby]="form.controls.password.touched && form.controls.password.invalid ? 'password-error' : null"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span class="field__error" id="password-error">Enter your password.</span>
        }
      </label>

      <button type="submit" class="login__submit" [disabled]="submitting()" [attr.aria-busy]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="login__help">
      Forgotten your password? Ask an administrator to issue a reset link. Accounts are never
      created from this screen.
    </p>
  </div>
</section>
