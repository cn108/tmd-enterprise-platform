# Local development dependencies only.
# Credentials here are development placeholders, identical to backend/.env.example.
# Staging and production use managed secrets and are NOT defined in this file.
name: tmd-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: tmd-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tmd}
      POSTGRES_USER: ${POSTGRES_USER:-tmd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tmd_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - tmd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tmd} -d ${POSTGRES_DB:-tmd}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tmd-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - tmd_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  tmd_pgdata:
  tmd_redisdata:
